name: snake

# Gera a cobrinha comendo o gráfico de contribuições, nas cores do perfil,
# e publica na branch "output" (o README aponta pra lá).
on:
  schedule:
    - cron: "0 6 * * *"   # todo dia, 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f97316&color_dots=#161b22,#4a1d0a,#7c2d12,#c2410c,#f97316

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
